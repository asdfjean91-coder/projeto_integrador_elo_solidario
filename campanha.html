<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Campanha — Elo Solidário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark navbar-elo py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🤝 Elo Solidário</a>
            <div id="nav-acoes"></div>
        </div>
    </nav>

    <main class="container my-4" style="max-width: 720px;">
        <div id="detalhe-campanha" class="card p-4 shadow-sm mb-4">Carregando...</div>

        <form id="form-doacao" class="card p-4 shadow-sm">
            <h2 class="h5 fw-bold text-success mb-3">Registrar Doação</h2>
            <div id="alerta-doacao"></div>
            <div id="lista-itens-doar" class="mb-3"></div>

            <div class="mb-3">
                <label for="data-prevista" class="form-label fw-semibold">Data prevista de entrega</label>
                <input type="date" id="data-prevista" class="form-control" required>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="check-validade" required>
                <label class="form-check-label small" for="check-validade">
                    Confirmo que os itens estão dentro do prazo de validade e com embalagem íntegra (RN04).
                </label>
            </div>

            <button type="submit" class="btn btn-elo w-100 py-2">Confirmar Doação e Gerar Código</button>
        </form>
    </main>

    <script type="module" src="js/campanha.js"></script>
</body>
</html>
