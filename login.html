<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso — Elo Solidário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark navbar-elo py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
                <span class="fs-4">🤝</span>
                <span>Elo Solidário</span>
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">← Início</a>
        </div>
    </nav>

    <main class="container my-4" style="max-width: 560px;">
        <ul class="nav nav-tabs mb-3" id="authTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" data-bs-toggle="tab" data-bs-target="#tab-login" type="button">Entrar</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#tab-cadastro" type="button">Criar Conta</button>
            </li>
        </ul>

        <div id="alerta-auth"></div>

        <div class="tab-content card border-0 p-4 shadow-sm" style="border-radius: 20px;">
            <div class="tab-pane fade show active" id="tab-login">
                <form id="form-login">
                    <div class="mb-3">
                        <label for="login-email" class="form-label fw-semibold">E-mail</label>
                        <input type="email" id="login-email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="login-senha" class="form-label fw-semibold">Senha</label>
                        <input type="password" id="login-senha" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-elo w-100 py-2">Entrar</button>
                </form>
            </div>

            <div class="tab-pane fade" id="tab-cadastro">
                <form id="form-cadastro">
                    <div class="mb-3">
                        <label for="cad-perfil" class="form-label fw-semibold">Tipo de Cadastro</label>
                        <select id="cad-perfil" class="form-select">
                            <option value="doador">💛 Sou Doador (Pessoa Física / Empresa)</option>
                            <option value="organizacao">🏢 Sou Organização Receptora (ONG / Igreja / Associação)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="cad-nome" class="form-label fw-semibold">Nome Completo (ou Responsável)</label>
                        <input type="text" id="cad-nome" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="cad-email" class="form-label fw-semibold">E-mail</label>
                        <input type="email" id="cad-email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="cad-telefone" class="form-label fw-semibold">WhatsApp / Telefone (com DDD)</label>
                        <input type="tel" id="cad-telefone" class="form-control" placeholder="89999999999" required>
                    </div>
                    <div class="mb-3">
                        <label for="cad-senha" class="form-label fw-semibold">Senha (mínimo 6 caracteres)</label>
                        <input type="password" id="cad-senha" class="form-control" minlength="6" required>
                    </div>

                    <div id="campos-org" class="d-none border-top pt-3 mt-3">
                        <h2 class="h6 fw-bold text-success mb-3">🏢 Dados da Organização (Ponto de Coleta)</h2>
                        <div class="mb-2">
                            <label for="org-nome" class="form-label small fw-semibold">Nome da Instituição *</label>
                            <input type="text" id="org-nome" class="form-control" placeholder="Ex: Associação Comunitária Vida Nova">
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label for="org-tipo" class="form-label small fw-semibold">Tipo</label>
                                <select id="org-tipo" class="form-select">
                                    <option>Associação</option>
                                    <option>Igreja</option>
                                    <option>ONG</option>
                                    <option>Escola</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label for="org-cnpj" class="form-label small fw-semibold">CNPJ (Opcional)</label>
                                <input type="text" id="org-cnpj" class="form-control" placeholder="00.000.000/0001-00">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label for="org-endereco" class="form-label small fw-semibold">Endereço de Entrega *</label>
                            <input type="text" id="org-endereco" class="form-control" placeholder="Rua, número">
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label for="org-bairro" class="form-label small fw-semibold">Bairro *</label>
                                <input type="text" id="org-bairro" class="form-control">
                            </div>
                            <div class="col-6">
                                <label for="org-cidade" class="form-label small fw-semibold">Cidade *</label>
                                <input type="text" id="org-cidade" class="form-control" value="São Lourenço do Piauí">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label for="org-horario" class="form-label small fw-semibold">Horário de Atendimento *</label>
                            <input type="text" id="org-horario" class="form-control" placeholder="Seg a Sex, 08h às 17h">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-elo w-100 py-2 mt-3">Finalizar Cadastro</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
