<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo Solidário — Doação de Alimentos e Itens Básicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark navbar-elo py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🤝 Elo Solidário</a>
            <div id="nav-acoes" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <main class="container my-4">
        <section class="hero-card p-4 text-center mb-4">
            <h1 class="h4 fw-bold text-success mb-2">Ajude quem mais precisa: doe alimentos e itens básicos</h1>
            <p class="text-muted mb-3">Conectamos você diretamente a organizações verificadas com metas transparentes.</p>
            <div class="d-flex justify-content-center gap-2">
                <a href="#lista-campanhas" class="btn btn-elo px-4">Ver campanhas</a>
                <a href="login.html" class="btn btn-elo-amarelo px-4">Quero doar</a>
            </div>
        </section>

        <section class="row g-2 mb-4" aria-label="Filtros de campanha">
            <div class="col-md-5">
                <label for="filtro-busca" class="visually-hidden">Buscar por campanha ou item</label>
                <input type="search" id="filtro-busca" class="form-control" placeholder="Buscar por título ou item...">
            </div>
            <div class="col-md-4">
                <label for="filtro-cidade" class="visually-hidden">Filtrar por cidade</label>
                <input type="text" id="filtro-cidade" class="form-control" placeholder="Cidade (ex: São Lourenço do Piauí)">
            </div>
            <div class="col-md-3">
                <label for="filtro-status" class="visually-hidden">Situação</label>
                <select id="filtro-status" class="form-select">
                    <option value="ativa" selected>Campanhas Ativas</option>
                    <option value="encerrada">Campanhas Encerradas</option>
                </select>
            </div>
        </section>

        <section id="lista-campanhas" class="row g-3">
            <div class="col-12 text-center py-4 text-muted">Carregando campanhas...</div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
