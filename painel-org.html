<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Organização — Elo Solidário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark navbar-elo py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🤝 Elo Solidário</a>
            <div id="nav-acoes"></div>
        </div>
    </nav>
    <main class="container my-4">
        <div id="status-org-box" class="mb-4"></div>
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card p-3 shadow-sm mb-4">
                    <h2 class="h5 fw-bold text-success mb-3">Nova Campanha</h2>
                    <form id="form-nova-campanha">
                        <div class="mb-2">
                            <label class="form-label">Título</label>
                            <input type="text" id="camp-titulo" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Descrição</label>
                            <textarea id="camp-desc" class="form-control" rows="2" required></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Data de Encerramento</label>
                            <input type="date" id="camp-fim" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Item do Catálogo e Meta</label>
                            <div class="input-group">
                                <select id="select-item-cat" class="form-select"></select>
                                <input type="number" id="meta-item-cat" class="form-control" placeholder="Qtd" min="1" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-elo w-100 mt-2">Publicar Campanha</button>
                    </form>
                </div>

                <div class="card p-3 shadow-sm">
                    <h2 class="h5 fw-bold text-success mb-3">Registrar Distribuição (RN06)</h2>
                    <form id="form-distribuicao">
                        <div class="mb-2">
                            <label class="form-label">Campanha</label>
                            <select id="select-camp-dist" class="form-select" required></select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Total de Famílias Atendidas</label>
                            <input type="number" id="dist-familias" class="form-control" min="1" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Descrição da Entrega (sem dados pessoais)</label>
                            <textarea id="dist-desc" class="form-control" rows="2" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-elo-amarelo w-100 mt-2">Registrar Prestação de Contas</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card p-3 shadow-sm mb-4">
                    <h2 class="h5 fw-bold text-success mb-3">Doações Aguardando Recebimento (RF07)</h2>
                    <div id="lista-doacoes-pendentes">Carregando...</div>
                </div>
                <div class="card p-3 shadow-sm">
                    <h2 class="h5 fw-bold text-success mb-3">Minhas Campanhas</h2>
                    <div id="lista-minhas-campanhas">Carregando...</div>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="js/painel-org.js"></script>
</body>
</html>
